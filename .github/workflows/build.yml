name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # This .NET 10 workload set targets Xcode 26.5.
  MAUI_WORKLOAD_SET: 10.401.0
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  api:
    name: ASP.NET Core API
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet build src/SaffronWok.Api --configuration Release

  android:
    name: MAUI Android
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: dotnet workload install maui-android --version "$MAUI_WORKLOAD_SET"
      - name: Build Android
        run: |
          dotnet build src/SaffronWok.Mobile --configuration Debug --framework net10.0-android \
            -p:TargetFrameworks=net10.0-android

  ios:
    name: MAUI iOS Simulator
    runs-on: macos-26
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Verify Xcode and simulator SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
      - run: dotnet workload install maui-ios --version "$MAUI_WORKLOAD_SET"
      - name: Build without Apple signing
        run: |
          dotnet build src/SaffronWok.Mobile --configuration Debug --framework net10.0-ios \
            -p:TargetFrameworks=net10.0-ios -p:RuntimeIdentifier=iossimulator-arm64 \
            -p:EnableCodeSigning=false
